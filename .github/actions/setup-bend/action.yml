name: Setup Bend
description: Install a pinned Bend release, verified by sha256 (kept in the runner's tool cache).
inputs:
  version:
    description: Bend version
    default: "2.0.25"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   plat=linux-x64;    sum=91c0e2640f8d2e3e73fd3dd62ed4d178ce9a6f7ce8f8980b4dc4abf7a6f9ccd4 ;;
          Linux-ARM64) plat=linux-arm64;  sum=c7cce7508fd13201d544180cca531a87a89c41829876c431cdfa0ea7f5308481 ;;
          macOS-ARM64) plat=darwin-arm64; sum=c5bb22ba029d5909da9c6db82aa037278a66d1cf8a5572f433879f7dcd866c31 ;;
          macOS-X64)   plat=darwin-x64;   sum=78e70cda4068f83736649c760575f4382259d5817be96d2eb04b9d078d943af0 ;;
          *) echo "unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        [ "${{ inputs.version }}" = "2.0.25" ] || { echo "update the pinned sha256 sums for ${{ inputs.version }}"; exit 1; }
        name="bend-${{ inputs.version }}-${plat}.tar.gz"
        # the self-hosted runners keep RUNNER_TOOL_CACHE between jobs; the
        # archive is checked against the pinned sum on every use
        kept="${RUNNER_TOOL_CACHE:-$HOME/.cache}/bend/$name"
        if ! { [ -f "$kept" ] && echo "$sum  $kept" | shasum -a 256 -c - >/dev/null 2>&1; }; then
          mkdir -p "$(dirname "$kept")"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$kept.$$" \
            "https://github.com/bendlang/bend/releases/download/v${{ inputs.version }}/$name"
          echo "$sum  $kept.$$" | shasum -a 256 -c -
          mv "$kept.$$" "$kept"
        fi
        tmp=$(mktemp -d)
        tar -xzf "$kept" -C "$tmp"
        mkdir -p "$HOME/.bend/bin"
        mv "$tmp/bend/bend2" "$tmp/bend/guide" "$HOME/.bend/"
        mv "$tmp/bend/bin/bend" "$HOME/.bend/bin/bend"
        echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
        echo "BEND_NO_TELEMETRY=1" >> "$GITHUB_ENV"
        echo "BEND_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
